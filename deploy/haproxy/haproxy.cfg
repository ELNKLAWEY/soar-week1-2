global
    # Runtime API for the executor (lab network only; use a unix socket on a shared volume in production)
    stats socket ipv4@0.0.0.0:9999 level admin
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout tarpit 5s

frontend web_in
    bind *:80
    option forwardfor
    # pre-agent flood protection (A9 owns the tuning)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    acl blocked     src -f /acl/blocklist.acl
    acl tarpitted   src -f /acl/tarpit.acl
    acl ratelimited src -f /acl/ratelimit.acl
    http-request deny deny_status 403 if blocked
    http-request tarpit deny_status 429 if tarpitted
    http-request deny deny_status 429 if ratelimited { sc_http_req_rate(0) gt 10 }
    default_backend skyline

backend skyline
    server web1 website:8000
